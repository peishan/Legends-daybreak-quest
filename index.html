<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Legends: Daybreak Quest</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8E6FB0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Daybreak Quest" />

<link rel="stylesheet" href="css/daybreak.css?v=20260926-14fix" />
<link rel="stylesheet" href="css/adventure.css?v=20260926-14fix" />
</head>
<body>
<div id="app"></div>
<div id="startupError" style="display:none;position:fixed;inset:0;z-index:999999;background:#211b24;color:#fff;padding:24px;font-family:system-ui,sans-serif;overflow:auto">
  <h2 style="margin:0 0 12px">Daybreak could not start</h2>
  <p style="opacity:.85">This is a startup error, not a blank page. Your saved data has not been deleted.</p>
  <pre id="startupErrorText" style="white-space:pre-wrap;background:#120f14;padding:14px;border-radius:12px;font-size:12px"></pre>
  <button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;font-weight:700">Reload</button>
</div>
<script>
(function(){
  function show(e){
    var box=document.getElementById('startupError'), text=document.getElementById('startupErrorText');
    if(!box||!text)return;
    box.style.display='block';
    text.textContent=(e && (e.stack||e.message)) ? (e.stack||e.message) : String(e);
  }
  window.addEventListener('error',function(e){show(e.error||e.message);});
  window.addEventListener('unhandledrejection',function(e){show(e.reason||e);});
  window.__daybreakShowError=show;
})();
</script>
<script src="js/app.js?v=20260926-14fix"></script>
</body>
</html>
